apiVersion: v1
kind: ConfigMap
metadata:
  name: cyber-news-alert-config
data:
  LOG_LEVEL: "INFO"
  REQUEST_TIMEOUT_SECONDS: "15"
  MAX_ARTICLES_PER_SOURCE: "50"
  ENABLE_GDELT: "true"
  GDELT_QUERY_WINDOW_MINUTES: "180"
  RSS_FEEDS: "https://krebsonsecurity.com/feed/,https://www.bleepingcomputer.com/feed/,https://therecord.media/feed/"
  GOOGLE_NEWS_QUERIES: '["(phishing OR \"spear phishing\" OR \"business email compromise\") (company OR government OR university OR hospital OR organization)","(malvertising OR \"credential theft\" OR smishing OR vishing) (victim OR company OR organization)","(\"SEO poisoning\" OR \"watering hole\" OR \"social media scam\" OR \"fake update\" OR \"brand impersonation\" OR \"employee impersonation\" OR \"executive impersonation\" OR \"tech support scam\" OR \"social engineering\" OR deepfake OR \"voice cloning\") (cyber OR malware OR credentials OR phishing OR scam OR organization)"]'
  MIN_VICTIM_CONFIDENCE: "0.65"
  INCIDENT_DEDUPE_WINDOW_HOURS: "120"
  NEAR_DUPLICATE_ENABLED: "true"
  NEAR_DUPLICATE_THRESHOLD: "0.70"
  NEAR_DUPLICATE_MAX_COMPARISONS: "500"
  SUPPRESS_OUT_OF_SCOPE_DIGEST: "true"
  DIGEST_ENABLED: "true"
  DIGEST_MAX_ITEMS_PER_RUN: "100"
  ABSTRACT_MAX_CHARS: "420"
  MAX_VICTIM_WORDS: "8"
  POSTGRES_DB: "cyber_news"
  POSTGRES_USER: "cyber_news"
