name: Build And Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - k8s/overlays/prod/kustomization.yaml
      - graphify-out/**

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/giacometti-r/projecteagleeye

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update GitOps image tag
        run: |
          cd k8s/overlays/prod
          kustomize edit set image "${IMAGE_NAME}=${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Commit GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No GitOps image change to commit."
          else
            git commit -m "chore(gitops): update image tag to ${GITHUB_SHA} [skip ci]"
            git push
          fi
